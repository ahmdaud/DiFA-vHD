<script>
  const PAGE_META = {
    dashboard: { title: 'Dashboard', sub: 'Ringkasan aktivitas persuratan bulan ini' },
    masuk:     { title: 'Surat Masuk', sub: 'Daftar surat masuk & status disposisi' },
    keluar:    { title: 'Surat Keluar', sub: 'Daftar surat keluar bernomor otomatis' },
    disposisi: { title: 'Disposisi', sub: 'Pelacakan alur disposisi surat masuk secara real-time' },
    laporan:   { title: 'Laporan Bulanan', sub: 'Rekapitulasi berdasarkan kode klasifikasi arsip' },
    arsip:     { title: 'Arsip & Backup', sub: 'Backup tahunan dan reset nomor agenda' },
    master:    { title: 'Data Master', sub: 'Pejabat penandatangan & kode klasifikasi arsip' }
  };

  let charts = {};

  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => navigateTo(btn.dataset.page));
    });
    initResponsiveShell();
    navigateTo('dashboard');
    preloadMasterData();
  });

  /* ============================================================
   *  RESPONSIVE: laci menu (HP/tablet), tabel→kartu, preview cetak
   * ============================================================ */
  function setSidebar(open) {
    document.body.classList.toggle('sidebar-open', !!open);
    const t = document.getElementById('menuToggle');
    if (t) t.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  function initResponsiveShell() {
    const toggle = document.getElementById('menuToggle');
    if (toggle) toggle.addEventListener('click', () => setSidebar(!document.body.classList.contains('sidebar-open')));
    ['sidebarBackdrop', 'sidebarClose'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('click', () => setSidebar(false));
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') setSidebar(false); });
    window.addEventListener('resize', () => {
      if (window.innerWidth > 900) setSidebar(false);
      fitLembarFrame();
    });
    window.addEventListener('orientationchange', () => setTimeout(fitLembarFrame, 300));

    // Setiap kali konten berubah, beri label kolom pada sel tabel agar bisa tampil sebagai kartu di HP.
    let jadwal = null;
    const obs = new MutationObserver(() => {
      if (jadwal) return;
      jadwal = requestAnimationFrame(() => { jadwal = null; jadikanTabelResponsif(); });
    });
    obs.observe(document.getElementById('content'), { childList: true, subtree: true });
    jadikanTabelResponsif();
  }

  function jadikanTabelResponsif() {
    document.querySelectorAll('table.data-table:not(.rt)').forEach(tbl => {
      const heads = Array.from(tbl.querySelectorAll('thead th')).map(th => th.textContent.trim());
      if (!heads.length) return;
      tbl.querySelectorAll('tbody tr').forEach(tr => {
        Array.from(tr.children).forEach((td, i) => {
          if (td.tagName !== 'TD' || td.colSpan > 1) return;
          td.setAttribute('data-label', heads[i] || '');
          if (!td.firstElementChild || !td.firstElementChild.classList.contains('cell-val') || td.children.length > 1) {
            td.innerHTML = '<div class="cell-val">' + td.innerHTML + '</div>';
          }
        });
      });
      tbl.classList.add('rt');
    });
  }

  /** Skala preview lembar disposisi (A4 ±794px) agar muat lebar layar HP/tablet. */
  function fitLembarFrame() {
    const fr = document.getElementById('lembarFrame');
    if (!fr) return;
    try {
      const de = fr.contentDocument && fr.contentDocument.documentElement;
      if (!de) return;
      const A4_PX = 794;
      const z = Math.min(1, fr.clientWidth / A4_PX);
      de.style.zoom = z;
      fr.dataset.zoom = z;
    } catch (e) { /* abaikan */ }
  }

  function navigateTo(page) {
    setSidebar(false);
    window.scrollTo(0, 0);
    document.querySelectorAll('.nav-item').forEach(b => {
      b.classList.toggle('active', b.dataset.page === page);
    });
    const meta = PAGE_META[page] || { title: page, sub: '' };
    document.getElementById('pageTitle').textContent = meta.title;
    document.getElementById('pageSubtitle').textContent = meta.sub;

    const content = document.getElementById('content');
    content.innerHTML = '<div class="loading">Memuat data...</div>';

    if (page === 'dashboard') {
      loadDashboard();
    } else if (page === 'masuk') {
      loadSuratMasukPage();
    } else if (page === 'keluar') {
      loadSuratKeluarPage();
    } else if (page === 'disposisi') {
      loadDisposisiPage();
    } else if (page === 'laporan') {
      loadLaporanPage();
    } else if (page === 'arsip') {
      loadArsipPage();
    } else if (page === 'master') {
      loadMasterPage();
    } else {
      renderPlaceholder(page, meta.title);
    }
  }

  function renderPlaceholder(page, title) {
    const content = document.getElementById('content');
    content.innerHTML = `
      <div class="placeholder-card">
        <div class="big-ico">🚧</div>
        <h3>${title}</h3>
        <p>Modul ini terhubung ke sheet <b>${page}</b> dan siap dikembangkan lebih lanjut<br/>
        (form input, tabel lengkap, filter, dan export) menyesuaikan kebutuhan Anda.</p>
      </div>`;
  }

  /* ============================================================
   *  DASHBOARD
   * ============================================================ */
  function loadDashboard() {
    google.script.run
      .withSuccessHandler(renderDashboard)
      .withFailureHandler(showError)
      .getDashboardStats();
  }

  function showError(err) {
    document.getElementById('content').innerHTML =
      `<div class="empty-state">Gagal memuat data: ${err.message || err}<br/>
       Pastikan Anda sudah menjalankan <b>initializeSheets()</b> dari editor Apps Script.</div>`;
  }

  function renderDashboard(data) {
    const content = document.getElementById('content');

    content.innerHTML = `
      <div class="stat-grid">
        ${statCard('📥', 'icon-blue', data.totalMasukBulanIni, 'Surat Masuk Bulan Ini')}
        ${statCard('📤', 'icon-teal', data.totalKeluarBulanIni, 'Surat Keluar Bulan Ini')}
        ${statCard('⏳', 'icon-amber', data.totalPending, 'Menunggu Disposisi')}
        ${statCard('📝', 'icon-violet', data.totalDidisposisikan, 'Sudah Didisposisikan')}
        ${statCard('✅', 'icon-rose', data.totalSelesai, 'Surat Selesai')}
      </div>

      <div class="panel-grid">
        <div class="panel">
          <h3>Tren Surat Masuk &amp; Keluar</h3>
          <div class="panel-sub">6 bulan terakhir</div>
          <canvas id="trendChart" height="130"></canvas>
        </div>
        <div class="panel">
          <h3>Distribusi Klasifikasi Arsip</h3>
          <div class="panel-sub">Seluruh surat, berdasarkan kode induk</div>
          <canvas id="klasChart" height="180"></canvas>
        </div>
      </div>

      <div class="panel-grid">
        <div class="panel" style="grid-column: 1 / -1;">
          <h3>Surat Masuk Terbaru</h3>
          <div class="panel-sub">8 surat masuk terakhir yang tercatat</div>
          ${renderSuratMasukTable(data.recentSuratMasuk)}
        </div>
      </div>
    `;

    renderTrendChart(data.trend);
    renderKlasChart(data.klasifikasi);
  }

  function statCard(icon, iconClass, value, label) {
    return `
      <div class="stat-card">
        <div class="stat-icon ${iconClass}">${icon}</div>
        <div>
          <div class="stat-value">${value}</div>
          <div class="stat-label">${label}</div>
        </div>
      </div>`;
  }

  function statusBadge(status) {
    const s = (status || 'Baru').toString();
    let cls = 'badge-default';
    if (s === 'Didisposisikan') cls = 'badge-disposisi';
    else if (s === 'Selesai' || s === 'Closed' || s === 'Diterbitkan') cls = 'badge-selesai';
    else if (!status || s === 'Baru' || s === 'Menunggu' || s === 'Konsep') cls = 'badge-pending';
    return `<span class="badge ${cls}">${s}</span>`;
  }

  function renderSuratMasukTable(rows) {
    if (!rows || rows.length === 0) {
      return `<div class="empty-state">Belum ada data surat masuk.<br/>
        Tambahkan baris pada sheet <b>SuratMasuk</b> untuk melihatnya di sini.</div>`;
    }
    const body = rows.map(r => `
      <tr>
        <td>${r['No. Agenda'] || '-'}</td>
        <td>${formatDate(r['Diterima Tanggal'])}</td>
        <td>${r['Dari'] || '-'}</td>
        <td>${r['Hal'] || '-'}</td>
        <td>${r['Pimpinan Tujuan'] || '-'}</td>
        <td>${statusBadge(r['Status'])}</td>
      </tr>`).join('');

    return `
      <table class="data-table">
        <thead>
          <tr>
            <th>No. Agenda</th><th>Diterima Tgl</th><th>Dari</th>
            <th>Hal</th><th>Ditujukan Kepada</th><th>Status</th>
          </tr>
        </thead>
        <tbody>${body}</tbody>
      </table>`;
  }

  function formatDate(val) {
    if (!val) return '-';
    const d = new Date(val);
    if (isNaN(d)) return val;
    return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  /* ---------- CHARTS ---------- */
  function renderTrendChart(trend) {
    const ctx = document.getElementById('trendChart');
    if (!ctx) return;
    if (charts.trend) charts.trend.destroy();
    charts.trend = new Chart(ctx, {
      type: 'line',
      data: {
        labels: trend.labels,
        datasets: [
          {
            label: 'Surat Masuk',
            data: trend.masukCounts,
            borderColor: '#14507a',
            backgroundColor: 'rgba(20,80,122,0.08)',
            tension: 0.35,
            fill: true,
            pointRadius: 3
          },
          {
            label: 'Surat Keluar',
            data: trend.keluarCounts,
            borderColor: '#14b8a6',
            backgroundColor: 'rgba(20,184,166,0.08)',
            tension: 0.35,
            fill: true,
            pointRadius: 3
          }
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } },
        scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
      }
    });
  }

  function renderKlasChart(klasifikasi) {
    const ctx = document.getElementById('klasChart');
    if (!ctx) return;
    if (charts.klas) charts.klas.destroy();

    const labels = Object.keys(klasifikasi);
    const values = Object.values(klasifikasi);
    const palette = ['#14507a', '#14b8a6', '#f59e0b', '#f43f5e', '#8b5cf6', '#0ea5e9', '#84cc16'];

    if (labels.length === 0) {
      ctx.parentElement.innerHTML += '<div class="empty-state">Belum ada data klasifikasi.</div>';
      return;
    }

    charts.klas = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{
          data: values,
          backgroundColor: labels.map((_, i) => palette[i % palette.length]),
          borderWidth: 2,
          borderColor: '#ffffff'
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } },
        cutout: '62%'
      }
    });
  }

  /* ============================================================
   *  SURAT MASUK — daftar & form tambah
   * ============================================================ */
  function loadSuratMasukPage(tahun) {
    google.script.run
      .withSuccessHandler(renderSuratMasukPage)
      .withFailureHandler(showError)
      .getSuratMasukList(tahun);
  }

  function renderSuratMasukPage(result) {
    const rows = result.rows;
    const content = document.getElementById('content');
    content.innerHTML = `
      <div class="panel" style="margin-bottom:18px;">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
          <div>
            <h3 style="margin-bottom:2px;">Daftar Surat Masuk</h3>
            <div class="panel-sub" style="margin-bottom:0;">${rows.length} surat tercatat pada tahun ${result.tahunDipilih}</div>
          </div>
          <div style="display:flex;gap:10px;align-items:center;">
            ${yearFilterSelect(result.tahunTersedia, result.tahunDipilih, 'loadSuratMasukPage')}
            <button class="btn-primary" onclick="openTambahSuratModal()">+ Tambah Surat Masuk</button>
          </div>
        </div>
      </div>
      <div class="panel">
        ${renderSuratMasukFullTable(rows)}
      </div>
      <div id="modalRoot"></div>
    `;
    // Jika admin memilih "Cetak sekarang" setelah menyimpan surat, buka modal cetak begitu halaman siap.
    if (pendingCetakKode) {
      const kode = pendingCetakKode;
      pendingCetakKode = null;
      bukaModalCetakPDF(kode);
    }
  }

  let pendingCetakKode = null;

  function disposisiLanjutanBadge(status) {
    if (!status) return '-';
    const s = status.toString();
    if (s.indexOf('Diteruskan ke') === 0) return `<span class="badge badge-selesai">${s}</span>`;
    if (s.indexOf('Manual') > -1) return `<span class="badge badge-pending">${s}</span>`;
    return `<span class="badge badge-default">${s}</span>`;
  }

  function renderSuratMasukFullTable(rows) {
    if (!rows || rows.length === 0) {
      return `<div class="empty-state">Belum ada surat masuk. Klik "+ Tambah Surat Masuk" untuk menambahkan yang pertama.</div>`;
    }
    const body = rows.map(r => `
      <tr>
        <td>${r['No. Agenda'] || '-'}</td>
        <td>${formatDate(r['Diterima Tanggal'])}</td>
        <td>${r['Nomor Naskah Dinas'] || '-'}</td>
        <td>${r['Dari'] || '-'}</td>
        <td>${r['Hal'] || '-'}</td>
        <td>${r['Jenis'] || '-'}</td>
        <td>${r['Index'] || '-'}</td>
        <td>${r['Pimpinan Tujuan'] || '-'}</td>
        <td>${statusBadge(r['Status'])}</td>
        <td>${r['Disposisi Kepada'] ? `${r['Disposisi Kepada']}<br/>${disposisiLanjutanBadge(r['Status Diteruskan'])}` : (r['Status'] === 'Selesai' ? '-' : '<span class="badge badge-pending">Menunggu Disposisi</span>')}</td>
        <td>${r['Lampiran (URL)'] ? `<a href="${r['Lampiran (URL)']}" target="_blank" title="Lihat PDF">📎</a>` : '-'}</td>
        <td><button class="btn-icon" title="Cetak Lembar Disposisi (PDF)" onclick="cetakDisposisi(this, '${r['Kode Tracking']}')">🖨️</button></td>
      </tr>`).join('');

    return `
      <div style="overflow-x:auto;">
      <table class="data-table">
        <thead>
          <tr>
            <th>No. Agenda</th><th>Diterima Tgl</th><th>No. Naskah Dinas</th>
            <th>Dari</th><th>Hal</th><th>Jenis</th><th>Index</th>
            <th>Ditujukan Kepada</th><th>Status</th><th>Disposisi Lanjutan</th><th>Lampiran</th><th>Cetak</th>
          </tr>
        </thead>
        <tbody>${body}</tbody>
      </table>
      </div>`;
  }

  function openTambahSuratModal() {
    const root = document.getElementById('modalRoot');
    root.innerHTML = `
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
          <div class="modal-head">
            <h3>Tambah Surat Masuk</h3>
            <button class="modal-close" onclick="closeTambahSuratModal()">✕</button>
          </div>
          <div class="modal-body">
            <div class="form-grid">
              <div class="form-group">
                <label>Nomor Naskah Dinas</label>
                <input type="text" id="f_nomorNaskahDinas" placeholder="mis. 001/UM/IX/2026" />
              </div>
              <div class="form-group">
                <label>Tanggal Naskah Dinas</label>
                <input type="date" id="f_tanggalNaskahDinas" />
              </div>

              <div class="form-group">
                <label>Diterima Tanggal</label>
                <input type="date" id="f_diterimaTanggal" value="${todayISO()}" />
              </div>
              <div class="form-group">
                <label>Nomor Agenda</label>
                <input type="text" value="Otomatis oleh sistem" disabled />
              </div>

              <div class="form-group">
                <label>Sifat</label>
                <select id="f_sifat">
                  <option>Biasa</option>
                  <option>Penting</option>
                  <option>Segera</option>
                  <option>Sangat Segera</option>
                  <option>Rahasia</option>
                </select>
              </div>
              <div class="form-group">
                <label>Jenis</label>
                <select id="f_jenis">
                  <option>Surat Biasa</option>
                  <option>Surat Edaran</option>
                  <option>Surat Keputusan</option>
                  <option>Undangan</option>
                  <option>Nota Dinas</option>
                  <option>Surat Tugas</option>
                  <option>Lainnya</option>
                </select>
              </div>

              <div class="form-group">
                <label>Index</label>
                <select id="f_index">
                  <option>Kepaniteraan</option>
                  <option>Kesekretariatan</option>
                </select>
              </div>
              <div class="form-group">
                <label>Status Naskah</label>
                <select id="f_statusNaskah">
                  <option>Asli</option>
                  <option>Tembusan</option>
                  <option>Salinan</option>
                  <option>Fotokopi</option>
                </select>
              </div>

              <div class="form-group span-2">
                <label>Dari</label>
                <input type="text" id="f_dari" placeholder="Instansi / pihak pengirim surat" />
              </div>

              <div class="form-group span-2">
                <label>Hal</label>
                <input type="text" id="f_hal" placeholder="Perihal surat" />
              </div>

              <div class="form-group">
                <label>Kode Klasifikasi Arsip</label>
                <select id="f_kodeKlasifikasi"><option>Memuat...</option></select>
              </div>
              <div class="form-group">
                <label>Ditujukan Kepada (Disposisi Awal)</label>
                <select id="f_pimpinanTujuan" onchange="onPimpinanChange()"><option>Memuat...</option></select>
              </div>

              <div class="form-group span-2">
                <label>Email Penerima (untuk notifikasi disposisi)</label>
                <input type="email" id="f_emailPimpinan" placeholder="nama@pengadilan.go.id" />
                <div class="field-hint" id="f_tujuanHint"></div>
              </div>

              <div class="form-group span-2">
                <label>Lampiran (PDF)</label>
                <input type="file" id="f_lampiran" accept="application/pdf" />
              </div>
            </div>
          </div>
          <div class="modal-foot">
            <button class="btn-secondary" onclick="closeTambahSuratModal()">Batal</button>
            <button class="btn-primary" id="btnSimpanSurat" onclick="submitTambahSurat()">Simpan &amp; Kirim Notifikasi</button>
          </div>
        </div>
      </div>`;

    document.getElementById('modalOverlay').classList.add('open');
    loadPejabatOptions();
    loadKlasifikasiOptions();
  }

  function closeTambahSuratModal() {
    const overlay = document.getElementById('modalOverlay');
    if (overlay) overlay.remove();
  }

  function todayISO() {
    const d = new Date();
    return d.toISOString().split('T')[0];
  }

  /** Dropdown filter tahun yang dipakai bersama di halaman Surat Masuk & Surat Keluar. */
  function yearFilterSelect(tahunTersedia, tahunDipilih, namaFungsiLoad) {
    return `
      <select onchange="${namaFungsiLoad}(this.value)" style="padding:9px 14px;border-radius:8px;border:1px solid #d7dfe9;background:#fbfcfe;font-size:13px;">
        ${tahunTersedia.map(t => `<option value="${t}" ${Number(t) === Number(tahunDipilih) ? 'selected' : ''}>${t}</option>`).join('')}
      </select>`;
  }

  /* ============================================================
   *  CACHE DATA MASTER (sisi klien)
   *  Pejabat & Klasifikasi jarang berubah, jadi setelah diambil
   *  sekali dari server, dropdown-dropdown berikutnya cukup pakai
   *  data ini — tidak perlu round-trip ke server tiap modal dibuka.
   *  Cache ini dikosongkan lagi otomatis setiap ada tambah/ubah/
   *  hapus Pejabat atau Klasifikasi (lihat invalidateMasterClientCache).
   * ============================================================ */
  let masterCache = { pejabat: null, klasifikasi: null };

  /**
   * Ambil Pejabat + Klasifikasi sekaligus dalam satu round-trip, dipanggil
   * sekali di background saat aplikasi pertama dibuka (lihat DOMContentLoaded
   * di bawah). Dengan begini, saat pengguna benar-benar membuka modal Surat
   * Masuk/Keluar, dropdown biasanya sudah langsung terisi tanpa jeda.
   */
  function preloadMasterData() {
    google.script.run.withSuccessHandler(data => {
      masterCache.pejabat = data.pejabat;
      masterCache.klasifikasi = data.klasifikasi;
    }).withFailureHandler(() => { /* diam saja — akan di-retry otomatis saat modal dibuka */ })
      .getMasterDataGabungan();
  }

  function getPejabatCached(callback) {
    if (masterCache.pejabat) { callback(masterCache.pejabat); return; }
    google.script.run.withSuccessHandler(list => {
      masterCache.pejabat = list;
      callback(list);
    }).withFailureHandler(showError).getMasterPejabat();
  }

  function getKlasifikasiCached(callback) {
    if (masterCache.klasifikasi) { callback(masterCache.klasifikasi); return; }
    google.script.run.withSuccessHandler(list => {
      masterCache.klasifikasi = list;
      callback(list);
    }).withFailureHandler(showError).getMasterKlasifikasi();
  }

  /** Dipanggil setelah tambah/ubah/hapus Pejabat atau Klasifikasi lewat menu Data Master. */
  function invalidateMasterClientCache(jenis) {
    if (jenis === 'pejabat') masterCache.pejabat = null;
    else if (jenis === 'klasifikasi') masterCache.klasifikasi = null;
    else { masterCache.pejabat = null; masterCache.klasifikasi = null; }
  }

  let pejabatCache = [];

  /** Kelompok tampilan dropdown tujuan surat. */
  const URUTAN_KELOMPOK_TUJUAN = ['Pimpinan', 'Hakim', 'Kepaniteraan', 'Kesekretariatan', 'Lainnya'];
  function kelompokTujuan(jabatan) {
    const j = (jabatan || '').toLowerCase();
    if (j.indexOf('hakim') === 0) return 'Hakim';
    if (j.indexOf('ketua') > -1) return 'Pimpinan';
    if (j.indexOf('panitera') > -1) return 'Kepaniteraan';
    if (j.indexOf('sekretaris') > -1 || j.indexOf('kasubbag') > -1) return 'Kesekretariatan';
    return 'Lainnya';
  }

  function loadPejabatOptions() {
    getPejabatCached(list => {
      pejabatCache = list;
      const sel = document.getElementById('f_pimpinanTujuan');
      if (!sel) return;
      const groups = {};
      list.forEach(p => {
        if (!p['Jabatan']) return;
        const g = kelompokTujuan(p['Jabatan']);
        (groups[g] = groups[g] || []).push(p);
      });
      sel.innerHTML = URUTAN_KELOMPOK_TUJUAN.filter(g => groups[g]).map(g =>
        `<optgroup label="${g}">` + groups[g].map(p =>
          `<option value="${escapeAttr(p['Jabatan'])}">${p['Jabatan']}${p['Nama Pejabat'] ? ' — ' + p['Nama Pejabat'] : ''}</option>`
        ).join('') + '</optgroup>'
      ).join('');

  function submitTambahSuratKeluar(action) {
  const val = id => (document.getElementById(id) || {}).value || '';
  const tanggalSurat = val('k_tanggalSurat');
  const penandatanganKode = val('k_penandatangan');
  const jenisSurat = val('k_jenisSurat'); // <-- Membaca pilihan Jenis Surat
  const kodeKlasifikasi = val('k_kodeKlasifikasi');
  const perihal = val('k_perihal');
  const tujuan = val('k_tujuan');

  if (!tanggalSurat || !penandatanganKode || !kodeKlasifikasi || !perihal || !tujuan) {
    alert('Semua kolom wajib diisi kecuali file lampiran.');
    return;
  }

  const fileInput = document.getElementById('k_file');
  const hasFile = fileInput && fileInput.files && fileInput.files[0];

  if (action === 'simpan' && !hasFile) {
    alert('File surat keluar wajib diunggah untuk status Simpan.\nGunakan tombol Konsep jika file belum siap.');
    return;
  }

  const btnSimpan = document.getElementById('btnSimpanSuratKeluar');
  const btnKonsep = document.getElementById('btnKonsepSuratKeluar');
  if (btnSimpan) btnSimpan.disabled = true;
  if (btnKonsep) btnKonsep.disabled = true;
  const activeBtn = action === 'simpan' ? btnSimpan : btnKonsep;
  if (activeBtn) activeBtn.textContent = 'Menyimpan...';

  // Mengirimkan jenisSurat ke server (suratkeluar.gs)
  const formData = {
    tanggalSurat, penandatanganKode, jenisSurat, kodeKlasifikasi, perihal, tujuan,
    status: action === 'simpan' ? 'Diterbitkan' : 'Konsep'
  };

  if (hasFile) {
    const reader = new FileReader();
    reader.onload = () => {
      formData.fileBase64 = reader.result.split(',')[1];
      formData.fileFileName = fileInput.files[0].name;
      kirimTambahSuratKeluar(formData, btnSimpan, btnKonsep);
    };
    reader.readAsDataURL(fileInput.files[0]);
  } else {
    kirimTambahSuratKeluar(formData, btnSimpan, btnKonsep);
  }
}

  function submitEditSuratKeluar(action, nomorLengkap) {
    const perihal = (document.getElementById('e_perihal') || {}).value || '';
    const tujuan = (document.getElementById('e_tujuan') || {}).value || '';
    const fileInput = document.getElementById('e_file');
    const hasNewFile = fileInput && fileInput.files && fileInput.files[0];

    if (!perihal || !tujuan) {
      alert('Perihal dan Tujuan wajib diisi.');
      return;
    }

    const row = suratKeluarCache.find(r => r['Nomor Surat Lengkap'] === nomorLengkap);
    const hasExistingFile = row && row['File PDF (URL)'];

    if (action === 'simpan' && !hasNewFile && !hasExistingFile) {
      alert('File surat keluar wajib diunggah untuk status Simpan.\nGunakan tombol Konsep jika file belum siap.');
      return;
    }

    const btnSimpan = document.getElementById('btnSimpanEdit');
    const btnKonsep = document.getElementById('btnKonsepEdit');
    if (btnSimpan) btnSimpan.disabled = true;
    if (btnKonsep) btnKonsep.disabled = true;
    const activeBtn = action === 'simpan' ? btnSimpan : btnKonsep;
    if (activeBtn) activeBtn.textContent = 'Menyimpan...';

    const formData = { perihal, tujuan, status: action === 'simpan' ? 'Diterbitkan' : 'Konsep' };

    const finish = () => {
      google.script.run
        .withSuccessHandler(res => {
          closeTambahSuratModal();
          alert(`Surat berhasil diperbarui (${res.status === 'Konsep' ? 'terkonsep' : 'tersimpan'}).`);
          loadSuratKeluarPage();
        })
        .withFailureHandler(err => {
          alert('Gagal memperbarui: ' + (err.message || err));
          if (btnSimpan) { btnSimpan.disabled = false; btnSimpan.textContent = 'Simpan'; }
          if (btnKonsep) { btnKonsep.disabled = false; btnKonsep.textContent = 'Konsep'; }
        })
        .updateSuratKeluar(nomorLengkap, formData);
    };

    if (hasNewFile) {
      const reader = new FileReader();
      reader.onload = () => {
        formData.fileBase64 = reader.result.split(',')[1];
        formData.fileFileName = fileInput.files[0].name;
        finish();
      };
      reader.readAsDataURL(fileInput.files[0]);
    } else {
      finish();
    }
  }

  /* ============================================================
   *  DISPOSISI — pelacakan (tracking) sesuai PRD Bab 5

  function loadDisposisiPage() {
    google.script.run
      .withSuccessHandler(renderDisposisiPage)
      .withFailureHandler(showError)
      .getDisposisiList();

  function statusTindakLanjutBadge(status) {
    const s = (status || '-').toString();
    let cls = 'badge-default';
    if (s === 'Selesai') cls = 'badge-selesai';
    else if (s.indexOf('Diteruskan ke') === 0) cls = 'badge-disposisi';
    else if (s.indexOf('Manual') > -1 || s.indexOf('Menunggu') === 0) cls = 'badge-pending';
    return `<span class="badge ${cls}">${s}</span>`;
  }

  function renderDisposisiPage(rows) {
    const grouped = {};
    rows.forEach(r => {
      const k = r['Kode Tracking'];
      if (!grouped[k]) grouped[k] = [];
      grouped[k].push(r);
    });
    disposisiGroupedCache = grouped;
    const kodeList = Object.keys(grouped);

    const totalSurat = kodeList.length;
    const totalHop = rows.length;
    let selesai = 0, diteruskan = 0, manual = 0, menunggu = 0;
    kodeList.forEach(k => {
      const latest = grouped[k][0];
      const st = (latest['Status Tindak Lanjut'] || '').toString();
      if (latest['Status Surat'] === 'Selesai') selesai++;
      else if (st.indexOf('Menunggu') === 0) menunggu++;
      else if (st.indexOf('Diteruskan ke') === 0) diteruskan++;
      else if (st.indexOf('Manual') > -1) manual++;
    });

    const content = document.getElementById('content');
    content.innerHTML = `
      <div class="stat-grid">
        ${statCard('📄', 'icon-blue', totalSurat, 'Total Surat dalam Alur Disposisi')}
        ${statCard('⏳', 'icon-violet', menunggu, 'Menunggu Disposisi Pertama')}
        ${statCard('📤', 'icon-teal', diteruskan, 'Sedang Diteruskan Otomatis')}
        ${statCard('⚠️', 'icon-amber', manual, 'Perlu Diteruskan Manual')}
        ${statCard('✅', 'icon-rose', selesai, 'Surat Selesai')}
      </div>
      <div class="panel">
        <h3 style="margin-bottom:2px;">Daftar Surat dalam Alur Disposisi</h3>
        <div class="panel-sub">${totalSurat} surat &middot; total ${totalHop} langkah disposisi tercatat. Klik "Riwayat" untuk melihat detail rantai per surat.</div>
        ${renderDisposisiSuratTable(grouped, kodeList)}
      </div>
      <div id="modalRoot"></div>
    `;
  }

  let disposisiGroupedCache = {};

  function renderDisposisiSuratTable(grouped, kodeList) {
    if (!kodeList || kodeList.length === 0) {
      return `<div class="empty-state">Belum ada surat masuk. Setiap surat yang diinput akan langsung muncul di sini, lengkap dengan tujuan awalnya, dan siap dicetak lembar disposisinya.</div>`;
    }

    const body = kodeList.map(kode => {
      const hops = grouped[kode];
      const latest = hops[0];
      const suratSelesai = latest['Status Surat'] === 'Selesai';

      const aksiTambahan = suratSelesai
        ? `<span style="color:var(--text-muted);font-size:11.5px;">Selesai ${formatDate(latest['Tanggal Selesai'])}</span>`
        : `<button class="btn-icon" title="Lanjutkan Disposisi" onclick="openLanjutkanModal('${kode}', '${escapeAttr(latest['Pemegang Saat Ini'])}')">➡️</button>
           <button class="btn-icon" title="Tandai Selesai" onclick="tandaiSelesai('${kode}')">✔️</button>`;

      return `
      <tr>
        <td>${kode}</td>
        <td>${latest['No. Agenda Surat'] || '-'}</td>
        <td style="text-align:center;">${hops.filter(h => h['Pimpinan'] !== 'Admin (Input Surat)').length}</td>
        <td><span style="font-size:12px;color:#0d9488;">📍 ${latest['Pemegang Saat Ini'] || '-'}</span></td>
        <td>${statusTindakLanjutBadge(latest['Status Tindak Lanjut'])}</td>
        <td>
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <button class="btn-secondary" style="padding:6px 12px;font-size:12px;" onclick="bukaRiwayatDisposisi('${kode}')">📜 Riwayat</button>
            <button class="btn-icon" title="Cetak Lembar Disposisi (PDF)" onclick="cetakDisposisi(this, '${kode}')">🖨️</button>
            ${aksiTambahan}
          </div>
        </td>
      </tr>`;
    }).join('');

    return `
      <div style="overflow-x:auto;">
      <table class="data-table">
        <thead>
          <tr>
            <th>Kode Tracking</th><th>No. Agenda</th><th>Langkah</th>
            <th>Pemegang Saat Ini</th><th>Status Terakhir</th><th>Aksi</th>
          </tr>
        </thead>
        <tbody>${body}</tbody>
      </table>
      </div>`;
  }

  function bukaRiwayatDisposisi(kode) {
    const hops = (disposisiGroupedCache[kode] || []).slice().reverse(); // urut kronologis: paling lama -> terbaru
    if (hops.length === 0) return;
    const latest = hops[hops.length - 1];
    const suratSelesai = latest['Status Surat'] === 'Selesai';

    const body = hops.map((r, idx) => {
      const isLast = idx === hops.length - 1;
      return `
        <tr${!isLast ? ' style="opacity:0.65;"' : ''}>
          <td>${r['Pimpinan'] || '-'}</td>
          <td>${r['Diteruskan Kepada'] || '-'}</td>
          <td>${r['Petunjuk Disposisi'] || '-'}</td>
          <td>${formatDate(r['Tanggal Disposisi'])}</td>
          <td>${statusTindakLanjutBadge(r['Status Tindak Lanjut'])}</td>
        </tr>`;
    }).join('');

    const root = document.getElementById('modalRoot');
    root.innerHTML = `
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box" style="max-width:740px;">
          <div class="modal-head">
            <h3>Riwayat Disposisi — ${kode}</h3>
            <button class="modal-close" onclick="closeTambahSuratModal()">✕</button>
          </div>
          <div class="modal-body">
            <div style="overflow-x:auto;">
            <table class="data-table">
              <thead><tr><th>Dari</th><th>Diteruskan Kepada</th><th>Petunjuk</th><th>Tanggal</th><th>Status</th></tr></thead>
              <tbody>${body}</tbody>
            </table>
            </div>
          </div>
          <div class="modal-foot">
            <button class="btn-secondary" onclick="closeTambahSuratModal()">Tutup</button>
            <button class="btn-outline" onclick="cetakDisposisi(this, '${kode}')">🖨️ Cetak PDF</button>
            ${suratSelesai ? '' : `
              <button class="btn-secondary" onclick="openLanjutkanModal('${kode}', '${escapeAttr(latest['Pemegang Saat Ini'])}')">➡️ Lanjutkan</button>
              <button class="btn-primary" onclick="tandaiSelesai('${kode}')">✔️ Tandai Selesai</button>
            `}
          </div>
        </div>
      </div>`;
    document.getElementById('modalOverlay').classList.add('open');
  }

  function tandaiSelesai(kodeTracking) {
    if (!confirm(`Tandai surat ${kodeTracking} sebagai selesai ditindaklanjuti?\nRantai disposisi akan ditutup dan surat berstatus "Selesai".`)) return;

    google.script.run
      .withSuccessHandler(res => {
        if (res.success) {
          loadDisposisiPage();
        } else {
          alert(res.message);
        }
      })
      .withFailureHandler(err => alert('Gagal menandai selesai: ' + (err.message || err)))
      .tandaiDisposisiSelesai(kodeTracking);
  }

  /* ---------- LANJUTKAN DISPOSISI (admin, manual, berjenjang) ---------- */
  const PETUNJUK_OFFICIAL_JS = [
    'Setuju Sesuai Ketentuan yang berlaku', 'Tolak Sesuai Ketentuan',
    'Selesaikan sesuai ketentuan yang berlaku', 'Jawab sesuai ketentuan yang berlaku',

            <button class="btn-secondary" onclick="closeTambahSuratModal()">Batal</button>

    document.getElementById('modalOverlay').classList.add('open');

    const petunjukSel = document.getElementById('l_petunjuk');

  function submitLanjutkanDisposisi(kodeTracking) {
    const petunjuk = (document.getElementById('l_petunjuk') || {}).value || '';
    const checked = Array.from(document.querySelectorAll('.l-target-checkbox:checked')).map(el => el.value);
    const diteruskan = checked.join('; ');
    const catatan = (document.getElementById('l_catatan') || {}).value || '';

    if (!petunjuk) {
      alert('Petunjuk disposisi wajib dipilih.');
      return;
    }

    const btn = document.getElementById('btnLanjutkan');
    btn.disabled = true;
    btn.textContent = 'Menyimpan...';

    google.script.run
      .withSuccessHandler(res => {
        closeTambahSuratModal();
        if (res.success) {
          alert(`Disposisi tercatat.\nStatus: ${res.statusLanjut}`);
          loadDisposisiPage();
        } else {
          alert(res.message);
        }
      })
      .withFailureHandler(err => {
        alert('Gagal menyimpan: ' + (err.message || err));
        btn.disabled = false;
        btn.textContent = 'Catat & Teruskan';
      })
      .lanjutkanDisposisiManual(kodeTracking, { petunjuk, diteruskanKepada: diteruskan, catatan });
  }

  function cetakDisposisi(btnEl, kodeTracking) {
    bukaModalCetakPDF(kodeTracking);
  }

  let lembarHtmlAktif = '';

  function bukaModalCetakPDF(kodeTracking) {
    const root = document.getElementById('modalRoot');
    lembarHtmlAktif = '';
    root.innerHTML = `
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box" style="max-width:940px;">
          <div class="modal-head">
            <h3>Lembar Disposisi — ${kodeTracking}</h3>
            <button class="modal-close" onclick="closeTambahSuratModal()">✕</button>
          </div>
          <div class="modal-body" id="cetakPdfBody" style="text-align:center;padding:60px 24px;">
            <div class="pdf-spinner"></div>
            <p style="margin-top:14px;color:var(--text-muted);font-size:13px;">Menyiapkan lembar disposisi...</p>
          </div>
          <div class="modal-foot" id="cetakFoot">
            <button class="btn-secondary" onclick="closeTambahSuratModal()">Tutup</button>
          </div>
        </div>
      </div>`;
    document.getElementById('modalOverlay').classList.add('open');

    google.script.run
      .withSuccessHandler(res => {
        const body = document.getElementById('cetakPdfBody');
        if (!body) return; // modal sudah ditutup
        if (!res.success) {
          body.innerHTML = `<div class="empty-state">${res.message || 'Gagal menyiapkan lembar disposisi.'}</div>`;
          return;
        }
        lembarHtmlAktif = res.html;
        body.style.padding = '0';
        body.style.textAlign = 'left';
        body.innerHTML = `<iframe id="lembarFrame" title="Preview Lembar Disposisi" style="width:100%;height:68vh;min-height:320px;border:0;background:#e9edf2;"></iframe>`;
        const frEl = document.getElementById('lembarFrame');
        frEl.onload = fitLembarFrame;
        frEl.srcdoc = res.html;

        document.getElementById('cetakFoot').innerHTML = `
          <button class="btn-secondary" onclick="closeTambahSuratModal()">Tutup</button>
          <button class="btn-outline" id="btnSimpanDrive" onclick="simpanLembarKeDrive('${kodeTracking}')" title="Membuat file PDF permanen di Google Drive (5–15 detik)">☁️ Simpan PDF ke Drive</button>
          <button class="btn-outline" onclick="bukaLembarTabBaru()">↗ Tab Baru</button>
          <button class="btn-primary" onclick="cetakIframeLembar()">🖨️ Cetak / Simpan PDF</button>`;
      })
      .withFailureHandler(err => {
        const body = document.getElementById('cetakPdfBody');
        if (body) body.innerHTML = `<div class="empty-state">Gagal memuat: ${err.message || err}</div>`;
      })
      .getLembarDisposisiHtml(kodeTracking);
  }

  /** Cetak langsung dari preview. Di dialog cetak browser pilih "Save as PDF" untuk menyimpan PDF. */
  function cetakIframeLembar() {
    const fr = document.getElementById('lembarFrame');
    try {
      // Cetak harus pada skala 100% (zoom preview dilepas sementara).
      const de = fr.contentDocument.documentElement;
      const zoomLama = de.style.zoom;
      de.style.zoom = 1;
      const pulihkan = () => { de.style.zoom = zoomLama; };
      fr.contentWindow.onafterprint = pulihkan;
      setTimeout(pulihkan, 4000);
      fr.contentWindow.focus();
      fr.contentWindow.print();
    } catch (e) {
      bukaLembarTabBaru();
    }
  }

  function bukaLembarTabBaru() {
    if (!lembarHtmlAktif) return;
    const w = window.open('', '_blank');
    if (!w) { alert('Popup diblokir browser. Izinkan popup untuk situs ini lalu coba lagi.'); return; }
    w.document.open();
    w.document.write(lembarHtmlAktif);
    w.document.close();
    setTimeout(() => { try { w.focus(); w.print(); } catch (e) {} }, 500);
  }

  /** Opsional: buat file PDF permanen di Drive (versi lama, lebih lambat). */
  function simpanLembarKeDrive(kodeTracking) {
    const btn = document.getElementById('btnSimpanDrive');
    if (btn) { btn.disabled = true; btn.textContent = 'Membuat PDF...'; }
    google.script.run
      .withSuccessHandler(res => {
        if (btn) { btn.disabled = false; btn.textContent = '☁️ Simpan PDF ke Drive'; }
        if (res.success) window.open(res.pdfUrl, '_blank');
        else alert(res.message || 'Gagal membuat PDF.');
      })
      .withFailureHandler(err => {
        if (btn) { btn.disabled = false; btn.textContent = '☁️ Simpan PDF ke Drive'; }
        alert('Gagal: ' + (err.message || err));
      })
      .cetakLembarDisposisi(kodeTracking);
  }

  /* ============================================================

  let laporanChartInstance = null;

  function loadLaporanPage() {
    const content = document.getElementById('content');
    const now = new Date();
    const currentYear = now.getFullYear();
    const bulanOptions = ['Semua Bulan','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

    content.innerHTML = `
      <div class="panel" style="margin-bottom:18px;">

        <div class="panel-sub">Pilih periode &amp; klasifikasi, lalu klik Terapkan Filter</div>
        <div class="form-grid" style="margin-top:14px;">
          <div class="form-group">
            <label>Bulan</label>
            <select id="lap_bulan">
              ${bulanOptions.map((b,i) => `<option value="${i}" ${i === now.getMonth()+1 ? 'selected' : ''}>${b}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label>Tahun</label>
            <select id="lap_tahun">
              ${[currentYear, currentYear-1, currentYear-2].map(y => `<option value="${y}">${y}</option>`).join('')}
            </select>
          </div>
          <div class="form-group span-2">
            <label>Kode Klasifikasi</label>
            <select id="lap_klasifikasi"><option value="Semua">Semua Klasifikasi</option></select>
          </div>
        </div>
        <button class="btn-primary" style="margin-top:14px;" onclick="terapkanFilterLaporan()">Terapkan Filter</button>
      </div>
      <div id="laporanHasil"><div class="loading">Memuat laporan...</div></div>
    `;

    getKlasifikasiCached(list => {
      const sel = document.getElementById('lap_klasifikasi');
      if (!sel) return;
      list.forEach(k => {
        sel.innerHTML += `<option value="${escapeAttr(k['Kode Klasifikasi'])}">${k['Kode Klasifikasi']} — ${k['Nama Klasifikasi / Subjek']}</option>`;
      });
    });

    terapkanFilterLaporan();
  }

  function getCurrentLaporanFilters() {
    return {
      bulan: (document.getElementById('lap_bulan') || {}).value || 0,
      tahun: (document.getElementById('lap_tahun') || {}).value || new Date().getFullYear(),
      kodeKlasifikasi: (document.getElementById('lap_klasifikasi') || {}).value || 'Semua'
    };
  }

  function terapkanFilterLaporan() {
    const hasil = document.getElementById('laporanHasil');
    if (!hasil) return;
    hasil.innerHTML = '<div class="loading">Memuat laporan...</div>';
    const filters = getCurrentLaporanFilters();

    google.script.run
      .withSuccessHandler(data => renderLaporanHasil(data, filters))
      .withFailureHandler(err => { hasil.innerHTML = `<div class="empty-state">Gagal memuat laporan: ${err.message || err}</div>`; })
      .getLaporanBulanan(filters);
  }

  function renderLaporanHasil(data) {
    const hasil = document.getElementById('laporanHasil');
    hasil.innerHTML = `
      <div class="stat-grid">
        ${statCard('📥', 'icon-blue', data.totalMasuk, 'Surat Masuk')}
        ${statCard('📤', 'icon-teal', data.totalKeluar, 'Surat Keluar')}
        ${statCard('📊', 'icon-violet', data.totalMasuk + data.totalKeluar, 'Total Surat')}
      </div>
      <div class="panel" style="margin-bottom:18px;">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
          <div>
            <h3 style="margin-bottom:2px;">Distribusi Klasifikasi</h3>
            <div class="panel-sub" style="margin-bottom:0;">Jumlah surat (masuk+keluar) per kode klasifikasi, periode terpilih</div>
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn-outline" id="btnExportExcel" onclick="exportLaporan('excel')">📊 Export Excel</button>
            <button class="btn-outline" id="btnExportPdf" onclick="exportLaporan('pdf')">📄 Export PDF</button>
          </div>

      </div>

  function renderLaporanMasukTable(rows) {
    if (!rows || !rows.length) return `<div class="empty-state">Tidak ada surat masuk pada periode/klasifikasi ini.</div>`;
    const body = rows.map(r => `
      <tr>
        <td>${r['No. Agenda'] || '-'}</td>
        <td>${formatDate(r['Diterima Tanggal'])}</td>
        <td>${r['Dari'] || '-'}</td>
        <td>${r['Hal'] || '-'}</td>
        <td>${r['Kode Klasifikasi'] || '-'}</td>
        <td>${statusBadge(r['Status'])}</td>
      </tr>`).join('');
    return `<div style="overflow-x:auto;"><table class="data-table"><thead><tr>
      <th>No. Agenda</th><th>Tgl</th><th>Dari</th><th>Hal</th><th>Klasifikasi</th><th>Status</th>
      </tr></thead><tbody>${body}</tbody></table></div>`;
  }

  function renderLaporanKeluarTable(rows) {
    if (!rows || !rows.length) return `<div class="empty-state">Tidak ada surat keluar pada periode/klasifikasi ini.</div>`;
    const body = rows.map(r => `
      <tr>
        <td><b>${r['Nomor Surat Lengkap'] || '-'}</b></td>
        <td>${formatDate(r['Tanggal'])}</td>
        <td>${r['Pejabat Penandatangan'] || '-'}</td>
        <td>${r['Perihal'] || '-'}</td>
        <td>${r['Kode Klasifikasi'] || '-'}</td>
        <td>${statusBadge(r['Status'])}</td>
      </tr>`).join('');
    return `<div style="overflow-x:auto;"><table class="data-table"><thead><tr>
      <th>Nomor Surat</th><th>Tgl</th><th>Penandatangan</th><th>Perihal</th><th>Klasifikasi</th><th>Status</th>
      </tr></thead><tbody>${body}</tbody></table></div>`;
  }

  function renderLaporanChart(klasifikasi) {
    const ctx = document.getElementById('laporanKlasChart');
    if (!ctx) return;
    if (laporanChartInstance) laporanChartInstance.destroy();

    const labels = Object.keys(klasifikasi);
    const values = Object.values(klasifikasi);

    if (labels.length === 0) {
      ctx.parentElement.innerHTML += '<div class="empty-state">Belum ada data untuk periode ini.</div>';
      return;
    }

    laporanChartInstance = new Chart(ctx, {
      type: 'bar',
      data: { labels: labels, datasets: [{ label: 'Jumlah Surat', data: values, backgroundColor: '#14507a', borderRadius: 4 }] },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
      }
    });
  }

  function exportLaporan(type) {
    const filters = getCurrentLaporanFilters();
    const btnId = type === 'excel' ? 'btnExportExcel' : 'btnExportPdf';
    const btn = document.getElementById(btnId);
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Memproses...';

    const fnName = type === 'excel' ? 'exportLaporanExcel' : 'exportLaporanPDF';
    
    google.script.run
      .withSuccessHandler(res => {
        btn.disabled = false;
        btn.textContent = originalText;

        if (res.success && res.url) {
          // Membuat link otomatis untuk langsung mengunduh/membuka file
          const link = document.createElement('a');
          link.href = res.url;
          link.target = '_blank';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        } else {
          alert(res.message || 'Gagal mengekspor laporan.');
        }
      })
      .withFailureHandler(err => {
        btn.disabled = false;
        btn.textContent = originalText;
        alert('Gagal mengekspor: ' + (err.message || err));
      })
      [fnName](filters);
  }

  /* ============================================================
   *  ARSIP & BACKUP TAHUNAN (PRD Bab 8)
   * ============================================================ */
  function loadArsipPage() {
    const content = document.getElementById('content');
    content.innerHTML = '<div class="loading">Memuat data arsip...</div>';
    google.script.run
      .withSuccessHandler(renderArsipPage)
      .withFailureHandler(showError)
      .getArsipInfo();
  }

  function renderArsipPage(info) {
    const content = document.getElementById('content');
    const totalHistori = info.histori.reduce((a, h) => a + h.jumlahBaris, 0);
    const tahunList = [info.tahunSekarang, info.tahunSekarang - 1, info.tahunSekarang - 2];

    content.innerHTML = `
      <div class="stat-grid">
        ${statCard('📥', 'icon-blue', info.jmlMasukTahunIni, 'Surat Masuk ' + info.tahunSekarang)}
        ${statCard('📤', 'icon-teal', info.jmlKeluarTahunIni, 'Surat Keluar ' + info.tahunSekarang)}
        ${statCard('🗄️', 'icon-violet', totalHistori, 'Total Baris Terarsip')}
      </div>

      <div class="panel" style="margin-bottom:18px;">
        <h3 style="margin-bottom:2px;">Backup Manual</h3>
        <div class="panel-sub">Unduh seluruh data persuratan &amp; lampiran PDF tahun tertentu dalam satu file .zip</div>
        <div style="display:flex;gap:10px;align-items:end;margin-top:14px;flex-wrap:wrap;">
          <div class="form-group" style="margin:0;">
            <label>Tahun</label>
            <select id="backup_tahun">
              ${tahunList.map(y => `<option value="${y}">${y}</option>`).join('')}
            </select>
          </div>
          <button class="btn-primary" id="btnBackup" onclick="jalankanBackup()">⬇️ Buat &amp; Unduh Backup (.zip)</button>
        </div>
        <div class="field-hint">Proses bisa memakan waktu beberapa menit tergantung jumlah lampiran PDF yang perlu dikumpulkan.</div>
      </div>

      <div class="panel" style="margin-bottom:18px;">
        <h3 style="margin-bottom:2px;">Riwayat Backup</h3>
        <div class="panel-sub">10 backup terakhir yang tersimpan di folder Drive "Backup Tahunan"</div>
        ${renderDaftarBackup(info.daftarBackup)}
      </div>

      <div class="panel">
        <h3 style="margin-bottom:2px;">Reset Tahunan &amp; Arsip Historis</h3>
        <div class="panel-sub">Memindahkan data tahun tertentu ke sheet arsip read-only, sekaligus mereset nomor urut agenda/surat keluar tahun berikutnya. Berjalan otomatis setiap 1 Januari jika trigger sudah dipasang (jalankan <code>setupResetTahunanTrigger</code> sekali dari editor Apps Script).</div>
        <table class="data-table" style="margin-top:14px;">
          <thead><tr><th>Sumber Data</th><th>Baris Terarsip (semua tahun)</th></tr></thead>
          <tbody>
            ${info.histori.map(h => `<tr><td>${h.sheet}</td><td>${h.jumlahBaris}</td></tr>`).join('')}
          </tbody>
        </table>
        <div style="margin-top:16px;display:flex;gap:10px;align-items:end;flex-wrap:wrap;">
          <div class="form-group" style="margin:0;">
            <label>Arsipkan Tahun</label>
            <select id="reset_tahun">
              ${tahunList.slice().sort((a,b) => a - b).map(y => `<option value="${y}" ${y === info.tahunSekarang - 1 ? 'selected' : ''}>${y}</option>`).join('')}
            </select>
          </div>
          <button class="btn-secondary" id="btnReset" onclick="jalankanResetManual()">🗄️ Arsipkan Tahun Ini ke Histori</button>
        </div>
        <div class="field-hint">⚠️ Tindakan ini memindahkan data KELUAR dari sheet aktif (SuratMasuk/SuratKeluar/Disposisi) ke sheet arsip terpisah, lalu menguncinya sebagai read-only. Sangat disarankan membuat Backup Manual terlebih dahulu sebelum menjalankan ini.</div>
      </div>
    `;
  }

  function renderDaftarBackup(list) {
    if (!list || !list.length) return `<div class="empty-state">Belum ada backup yang dibuat.</div>`;
    const body = list.map(f => `
      <tr>
        <td>${f.nama}</td>
        <td>${formatDate(f.tanggal)}</td>
        <td><a href="${f.url}" target="_blank" class="attachment-link">⬇️ Unduh</a></td>
      </tr>`).join('');
    return `<div style="overflow-x:auto;"><table class="data-table"><thead><tr><th>Nama File</th><th>Dibuat</th><th>Aksi</th></tr></thead><tbody>${body}</tbody></table></div>`;
  }

  function jalankanBackup() {
    const tahun = (document.getElementById('backup_tahun') || {}).value;
    const btn = document.getElementById('btnBackup');
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Memproses (bisa beberapa menit)...';

    google.script.run
      .withSuccessHandler(res => {
        btn.disabled = false;
        btn.textContent = original;
        if (res.success) {
          window.open(res.url, '_blank');
          loadArsipPage();
        } else {
          alert(res.message || 'Gagal membuat backup.');
        }
      })
      .withFailureHandler(err => {
        btn.disabled = false;
        btn.textContent = original;
        alert('Gagal membuat backup: ' + (err.message || err));
      })
      .jalankanBackupManual(tahun);
  }

  function jalankanResetManual() {
    const tahun = (document.getElementById('reset_tahun') || {}).value;
    if (!confirm(`Yakin ingin mengarsipkan seluruh data tahun ${tahun} ke sheet histori?\n\nData akan DIPINDAHKAN keluar dari sheet aktif. Pastikan Anda sudah membuat Backup Manual terlebih dahulu.`)) return;

    const btn = document.getElementById('btnReset');
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Memproses...';

    google.script.run
      .withSuccessHandler(res => {
        alert(`Berhasil diarsipkan (tahun ${res.tahunDiarsipkan}).\nSurat Masuk: ${res.jmlMasuk}\nSurat Keluar: ${res.jmlKeluar}\nDisposisi: ${res.jmlDisposisi}`);
        loadArsipPage();
      })
      .withFailureHandler(err => {
        btn.disabled = false;
        btn.textContent = original;
        alert('Gagal mengarsipkan: ' + (err.message || err));
      })
      .jalankanResetTahunan(tahun);
  }

  /* ============================================================
   *  DATA MASTER — kelola Pejabat & Klasifikasi Arsip
   * ============================================================ */
  let masterTabAktif = 'pejabat';
  let masterPejabatCache = [];
  let masterKlasifikasiCache = [];

  function loadMasterPage() {
    masterTabAktif = 'pejabat';
    renderMasterShell();
  }

  function renderMasterShell() {
    const content = document.getElementById('content');
    content.innerHTML = `
      <div class="panel" style="margin-bottom:18px;">
        <div class="tabs-row" style="display:flex;gap:0;">
          <button class="tab-btn ${masterTabAktif === 'pejabat' ? 'active' : ''}" onclick="gantiTabMaster('pejabat')">👤 Pejabat Penandatangan</button>
          <button class="tab-btn ${masterTabAktif === 'klasifikasi' ? 'active' : ''}" onclick="gantiTabMaster('klasifikasi')">🏷️ Klasifikasi Arsip</button>
          <button class="tab-btn ${masterTabAktif === 'whatsapp' ? 'active' : ''}" onclick="gantiTabMaster('whatsapp')">🧪 Uji Coba WhatsApp</button>
        </div>
      </div>
      <div id="masterContent"><div class="loading">Memuat...</div></div>
      <div id="modalRoot"></div>
    `;
    if (masterTabAktif === 'pejabat') loadMasterPejabatTable();
    else if (masterTabAktif === 'klasifikasi') loadMasterKlasifikasiTable();
    else renderUjiCobaWhatsApp();
  }

  function gantiTabMaster(tab) {
    masterTabAktif = tab;
    renderMasterShell();
  }

  /* ---------- TAB: PEJABAT PENANDATANGAN ---------- */
  function loadMasterPejabatTable() {
    google.script.run.withSuccessHandler(renderMasterPejabatTable).withFailureHandler(showError).getMasterPejabat();
  }

  function renderMasterPejabatTable(rows) {
    masterPejabatCache = rows;
    const el = document.getElementById('masterContent');
    el.innerHTML = `
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
          <div>
            <h3 style="margin-bottom:2px;">Data Pejabat Penandatangan</h3>
            <div class="panel-sub" style="margin-bottom:0;">${rows.length} jabatan terdaftar — dipakai untuk penomoran Surat Keluar &amp; tujuan disposisi</div>
          </div>
          <button class="btn-primary" onclick="openPejabatModal()">+ Tambah Jabatan</button>
        </div>
        <div style="overflow-x:auto;margin-top:14px;">
        <table class="data-table">
          <thead><tr><th>Jabatan</th><th>Kode</th><th>Nama Pejabat</th><th>Email</th><th>No. WhatsApp</th><th>Aksi</th></tr></thead>
          <tbody>
            ${rows.length === 0 ? '<tr><td colspan="6" class="empty-state">Belum ada data.</td></tr>' : rows.map((r, i) => `
              <tr>
                <td>${r['Jabatan'] || '-'}</td>
                <td>${r['Kode'] || '-'}</td>
                <td>${r['Nama Pejabat'] || '-'}</td>
                <td>${r['Email'] ? r['Email'] : '<span style="color:#b45309;">belum diisi</span>'}</td>
                <td>${r['No. WhatsApp'] ? r['No. WhatsApp'] : '<span style="color:#b45309;">belum diisi</span>'}</td>
                <td>
                  <button class="btn-icon" title="Edit" onclick="openPejabatModal(${i})">✏️</button>
                  <button class="btn-icon" title="Hapus" onclick="hapusPejabatAksi('${escapeAttr(r['Jabatan'])}')">🗑️</button>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
        </div>
      </div>
    `;
  }

  function openPejabatModal(idx) {
    const isEdit = idx !== undefined;
    const data = isEdit ? masterPejabatCache[idx] : { 'Jabatan': '', 'Kode': '', 'Nama Pejabat': '', 'Email': '', 'No. WhatsApp': '' };
    const root = document.getElementById('modalRoot');
    root.innerHTML = `
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
          <div class="modal-head">
            <h3>${isEdit ? 'Edit Jabatan' : 'Tambah Jabatan'}</h3>
            <button class="modal-close" onclick="closeTambahSuratModal()">✕</button>
          </div>
          <div class="modal-body">
            <div class="form-grid">
              <div class="form-group span-2">
                <label>Nama Jabatan</label>
                <input type="text" id="m_jabatan" value="${escapeAttr(data['Jabatan'])}" placeholder="mis. Ketua Pengadilan" ${isEdit ? 'disabled' : ''} />
              </div>
              <div class="form-group">
                <label>Kode Penandatangan</label>
                <input type="text" id="m_kode" value="${escapeAttr(data['Kode'])}" placeholder="mis. KPA, SEK.01" />
              </div>
              <div class="form-group">
                <label>Nama Pejabat</label>
                <input type="text" id="m_nama" value="${escapeAttr(data['Nama Pejabat'])}" placeholder="Opsional" />
              </div>
              <div class="form-group span-2">
                <label>Email</label>
                <input type="email" id="m_email" value="${escapeAttr(data['Email'])}" placeholder="nama@pengadilan.go.id" />
              </div>
              <div class="form-group span-2">
                <label>No. WhatsApp</label>
                <input type="text" id="m_whatsapp" value="${escapeAttr(data['No. WhatsApp'])}" placeholder="mis. 081234567890" />
                <div class="field-hint">Dipakai untuk kirim notifikasi disposisi via WhatsApp (isi sama dengan email). Boleh diawali 08, +62, atau 62.</div>
              </div>
            </div>
            ${isEdit ? '<div class="field-hint">Nama jabatan tidak bisa diubah di sini (dipakai sebagai kunci data). Hapus lalu tambah baru jika perlu mengubah namanya.</div>' : ''}
          </div>
          <div class="modal-foot">
            <button class="btn-secondary" onclick="closeTambahSuratModal()">Batal</button>
            <button class="btn-primary" id="btnSimpanPejabat" onclick="simpanPejabat(${isEdit ? `'${escapeAttr(data['Jabatan'])}'` : 'null'})">Simpan</button>
          </div>
        </div>
      </div>`;
    document.getElementById('modalOverlay').classList.add('open');
  }

  function simpanPejabat(jabatanAsli) {
    const val = id => (document.getElementById(id) || {}).value || '';
    const payload = { jabatan: val('m_jabatan'), kode: val('m_kode'), namaPejabat: val('m_nama'), email: val('m_email'), noWhatsapp: val('m_whatsapp') };
    if (!payload.jabatan) { alert('Nama jabatan wajib diisi.'); return; }

    const btn = document.getElementById('btnSimpanPejabat');
    btn.disabled = true;
    btn.textContent = 'Menyimpan...';

    function onDone(res) {
      if (res.success) {
        invalidateMasterClientCache('pejabat');
        closeTambahSuratModal();
        loadMasterPejabatTable();
      } else {
        alert(res.message || 'Gagal menyimpan.');
        btn.disabled = false;
        btn.textContent = 'Simpan';
      }
    }
    function onFail(err) {
      alert('Gagal menyimpan: ' + (err.message || err));
      btn.disabled = false;
      btn.textContent = 'Simpan';
    }

    if (jabatanAsli) {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).updatePejabat(jabatanAsli, payload);
    } else {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).tambahPejabat(payload);
    }
  }

  function hapusPejabatAksi(jabatan) {
    if (!confirm(`Hapus jabatan "${jabatan}" dari data master?\nJabatan yang sudah dipakai di surat lama tidak akan terpengaruh, tapi tidak akan muncul lagi di pilihan form baru.`)) return;
    google.script.run
      .withSuccessHandler(res => {
        if (res.success) {
          invalidateMasterClientCache('pejabat');
          loadMasterPejabatTable();
        } else alert(res.message);
      })
      .withFailureHandler(err => alert('Gagal menghapus: ' + (err.message || err)))
      .hapusPejabat(jabatan);
  }

  /* ---------- TAB: KLASIFIKASI ARSIP ---------- */
  function loadMasterKlasifikasiTable() {
    google.script.run.withSuccessHandler(renderMasterKlasifikasiTable).withFailureHandler(showError).getMasterKlasifikasi();
  }

  function renderMasterKlasifikasiTable(rows) {
    masterKlasifikasiCache = rows;
    const el = document.getElementById('masterContent');
    el.innerHTML = `
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
          <div>
            <h3 style="margin-bottom:2px;">Data Klasifikasi Arsip</h3>
            <div class="panel-sub" style="margin-bottom:0;">${rows.length} kode klasifikasi terdaftar</div>
          </div>
          <button class="btn-primary" onclick="openKlasifikasiModal()">+ Tambah Klasifikasi</button>
        </div>
        <div style="overflow-x:auto;margin-top:14px;">
        <table class="data-table">
          <thead><tr><th>Kode Klasifikasi</th><th>Nama Klasifikasi / Subjek</th><th>Keterangan / Uraian</th><th>Aksi</th></tr></thead>
          <tbody>
            ${rows.length === 0 ? '<tr><td colspan="4" class="empty-state">Belum ada data.</td></tr>' : rows.map((r, i) => `
              <tr>
                <td><b>${r['Kode Klasifikasi'] || '-'}</b></td>
                <td>${r['Nama Klasifikasi / Subjek'] || '-'}</td>
                <td>${r['Keterangan / Uraian'] || '-'}</td>
                <td>
                  <button class="btn-icon" title="Edit" onclick="openKlasifikasiModal(${i})">✏️</button>
                  <button class="btn-icon" title="Hapus" onclick="hapusKlasifikasiAksi('${escapeAttr(r['Kode Klasifikasi'])}')">🗑️</button>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
        </div>
      </div>
    `;
  }

  function openKlasifikasiModal(idx) {
    const isEdit = idx !== undefined;
    const data = isEdit ? masterKlasifikasiCache[idx] : { 'Kode Klasifikasi': '', 'Nama Klasifikasi / Subjek': '', 'Keterangan / Uraian': '' };
    const root = document.getElementById('modalRoot');
    root.innerHTML = `
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
          <div class="modal-head">
            <h3>${isEdit ? 'Edit Klasifikasi' : 'Tambah Klasifikasi'}</h3>
            <button class="modal-close" onclick="closeTambahSuratModal()">✕</button>
          </div>
          <div class="modal-body">
            <div class="form-grid">
              <div class="form-group">
                <label>Kode Klasifikasi</label>
                <input type="text" id="k_kode" value="${escapeAttr(data['Kode Klasifikasi'])}" placeholder="mis. TI.01" ${isEdit ? 'disabled' : ''} />
              </div>
              <div class="form-group">
                <label>Nama Klasifikasi / Subjek</label>
                <input type="text" id="k_nama" value="${escapeAttr(data['Nama Klasifikasi / Subjek'])}" placeholder="mis. Jaringan" />
              </div>
              <div class="form-group span-2">
                <label>Keterangan / Uraian</label>
                <textarea id="k_keterangan" placeholder="Opsional" style="width:100%;padding:9px 11px;border:1px solid #d7dfe9;border-radius:8px;font-size:13px;font-family:inherit;min-height:70px;">${data['Keterangan / Uraian'] || ''}</textarea>
              </div>
            </div>
            ${isEdit ? '<div class="field-hint">Kode klasifikasi tidak bisa diubah di sini (dipakai sebagai kunci data). Hapus lalu tambah baru jika perlu mengubah kodenya.</div>' : ''}
          </div>
          <div class="modal-foot">
            <button class="btn-secondary" onclick="closeTambahSuratModal()">Batal</button>
            <button class="btn-primary" id="btnSimpanKlasifikasi" onclick="simpanKlasifikasi(${isEdit ? `'${escapeAttr(data['Kode Klasifikasi'])}'` : 'null'})">Simpan</button>
          </div>
        </div>
      </div>`;
    document.getElementById('modalOverlay').classList.add('open');
  }

  function simpanKlasifikasi(kodeAsli) {
    const val = id => (document.getElementById(id) || {}).value || '';
    const payload = { kode: val('k_kode'), nama: val('k_nama'), keterangan: val('k_keterangan') };
    if (!payload.kode) { alert('Kode klasifikasi wajib diisi.'); return; }

    const btn = document.getElementById('btnSimpanKlasifikasi');
    btn.disabled = true;
    btn.textContent = 'Menyimpan...';

    function onDone(res) {
      if (res.success) {
        invalidateMasterClientCache('klasifikasi');
        closeTambahSuratModal();
        loadMasterKlasifikasiTable();
      } else {
        alert(res.message || 'Gagal menyimpan.');
        btn.disabled = false;
        btn.textContent = 'Simpan';
      }
    }
    function onFail(err) {
      alert('Gagal menyimpan: ' + (err.message || err));
      btn.disabled = false;
      btn.textContent = 'Simpan';
    }

    if (kodeAsli) {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).updateKlasifikasi(kodeAsli, payload);
    } else {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).tambahKlasifikasi(payload);
    }
  }

  function hapusKlasifikasiAksi(kode) {
    if (!confirm(`Hapus klasifikasi "${kode}" dari data master?`)) return;
    google.script.run
      .withSuccessHandler(res => {
        if (res.success) {
          invalidateMasterClientCache('klasifikasi');
          loadMasterKlasifikasiTable();
        } else alert(res.message);
      })
      .withFailureHandler(err => alert('Gagal menghapus: ' + (err.message || err)))
      .hapusKlasifikasi(kode);
  }

  /* ---------- TAB: UJI COBA WHATSAPP ---------- */
  function renderUjiCobaWhatsApp() {
    const el = document.getElementById('masterContent');
    el.innerHTML = `
      <div class="panel">
        <h3 style="margin-bottom:2px;">Uji Coba Pengiriman WhatsApp (Fonnte)</h3>
        <div class="panel-sub">Kirim satu pesan percobaan untuk memastikan integrasi WhatsApp sudah tersambung dengan benar.</div>
        <div class="form-grid" style="margin-top:16px;max-width:520px;">
          <div class="form-group span-2">
            <label>Nomor WhatsApp Tujuan</label>
            <input type="text" id="wa_nomor" placeholder="mis. 081234567890" />
            <div class="field-hint">Boleh diawali 08, +62, atau 62 — akan dirapikan otomatis.</div>
          </div>
          <div class="form-group span-2">
            <label>Isi Pesan</label>
            <textarea id="wa_pesan" rows="4" style="width:100%;padding:9px 11px;border:1px solid #d7dfe9;border-radius:8px;font-size:13px;font-family:inherit;background:#fbfcfe;" placeholder="Kosongkan untuk memakai pesan uji coba bawaan"></textarea>
          </div>
        </div>
        <button class="btn-primary" id="btnUjiWa" onclick="kirimUjiCobaWhatsApp()" style="margin-top:6px;">Kirim Uji Coba</button>
        <div id="waHasil" style="margin-top:16px;"></div>
      </div>
    `;
  }

  function kirimUjiCobaWhatsApp() {
    const nomor = (document.getElementById('wa_nomor') || {}).value || '';
    const pesan = (document.getElementById('wa_pesan') || {}).value || '';
    const hasilBox = document.getElementById('waHasil');

    if (!nomor.trim()) {
      alert('Nomor WhatsApp tujuan wajib diisi.');
      return;
    }

    const btn = document.getElementById('btnUjiWa');
    btn.disabled = true;
    btn.textContent = 'Mengirim...';
    hasilBox.innerHTML = '';

    google.script.run
      .withSuccessHandler(res => {
        btn.disabled = false;
        btn.textContent = 'Kirim Uji Coba';
        hasilBox.innerHTML = res.success
          ? `<div style="padding:12px 16px;border-radius:8px;background:rgba(34,197,94,0.12);color:#15803d;font-size:13px;">✅ ${res.message}</div>`
          : `<div style="padding:12px 16px;border-radius:8px;background:rgba(244,63,94,0.12);color:#be123c;font-size:13px;">❌ ${res.message}</div>`;
      })
      .withFailureHandler(err => {
        btn.disabled = false;
        btn.textContent = 'Kirim Uji Coba';
        hasilBox.innerHTML = `<div style="padding:12px 16px;border-radius:8px;background:rgba(244,63,94,0.12);color:#be123c;font-size:13px;">❌ Gagal menghubungi server: ${err.message || err}</div>`;
      })
      .ujiCobaKirimWhatsApp(nomor, pesan);
  }
</script>
