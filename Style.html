<style>
  :root {
    --navy-950: #0a2540;
    --navy-900: #0f3d5c;
    --navy-800: #14507a;
    --teal-500: #14b8a6;
    --teal-400: #2dd4bf;
    --amber-500: #f59e0b;
    --rose-500: #f43f5e;
    --violet-500: #8b5cf6;
    --bg: #f4f7fb;
    --card-bg: #ffffff;
    --text-main: #1a2b3c;
    --text-muted: #6b7c93;
    --border: #e6ebf2;
    --radius: 14px;
    --shadow: 0 4px 16px rgba(15, 61, 92, 0.06);
    --shadow-hover: 0 8px 24px rgba(15, 61, 92, 0.12);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-main);
    height: 100%;
  }

  .app-shell {
    display: flex;
    min-height: 100vh;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar {
    width: 250px;
    flex-shrink: 0;
    background: linear-gradient(180deg, var(--navy-950), var(--navy-900) 60%, var(--navy-800));
    color: #dce7f0;
    display: flex;
    flex-direction: column;
    padding: 22px 16px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 6px 22px;
    margin-bottom: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .brand-icon {
    font-size: 26px;
    background: rgba(45, 212, 191, 0.15);
    width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
  }
  .brand-title { font-weight: 700; font-size: 15px; color: #fff; }
  .brand-sub { font-size: 11px; color: #94a9bd; }

  .nav-menu { display: flex; flex-direction: column; gap: 4px; flex: 1; }

  .nav-item {
    display: flex; align-items: center; gap: 10px;
    background: transparent; border: none;
    color: #b7c7d6;
    padding: 11px 14px;
    border-radius: 10px;
    font-size: 13.5px;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s, color 0.15s;
  }
  .nav-ico { font-size: 16px; width: 18px; text-align: center; }
  .nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .nav-item.active {
    background: linear-gradient(90deg, rgba(20,184,166,0.25), rgba(20,184,166,0.05));
    color: #fff;
    box-shadow: inset 3px 0 0 var(--teal-400);
    font-weight: 600;
  }

  .sidebar-footer {
    font-size: 11.5px;
    color: #8fa4b8;
    display: flex; align-items: center; gap: 6px;
    padding: 10px 6px 0;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--teal-400);
    box-shadow: 0 0 8px var(--teal-400);
  }

  /* ---------- MAIN ---------- */
  .main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 32px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
  }
  .topbar h1 { margin: 0; font-size: 20px; font-weight: 700; }
  .muted { color: var(--text-muted); font-size: 13px; margin: 4px 0 0; }

  .topbar-right { display: flex; align-items: center; gap: 14px; }
  .search-box {
    padding: 9px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg);
    font-size: 13px;
    width: 220px;
    outline: none;
  }
  .search-box:focus { border-color: var(--teal-500); }

  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, var(--teal-500), var(--navy-800));
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
  }

  .content { padding: 26px 32px 40px; flex: 1; }

  .loading { color: var(--text-muted); padding: 40px; text-align: center; }

  /* ---------- STAT CARDS ---------- */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
    margin-bottom: 26px;
  }

  .stat-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 18px 20px;
    display: flex; align-items: center; gap: 14px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }

  .stat-icon {
    width: 46px; height: 46px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .stat-value { font-size: 24px; font-weight: 800; line-height: 1.1; }
  .stat-label { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }

  .icon-blue   { background: rgba(20,80,122,0.1); color: var(--navy-800); }
  .icon-teal   { background: rgba(20,184,166,0.12); color: #0d9488; }
  .icon-amber  { background: rgba(245,158,11,0.12); color: #b45309; }
  .icon-rose   { background: rgba(244,63,94,0.12); color: #be123c; }
  .icon-violet { background: rgba(139,92,246,0.12); color: #6d28d9; }

  /* ---------- PANELS / GRID ---------- */
  .panel-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 18px;
    margin-bottom: 20px;
  }
  @media (max-width: 980px) { .panel-grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 20px 22px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .panel h3 {
    margin: 0 0 4px; font-size: 15px; font-weight: 700;
  }
  .panel .panel-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }

  /* ---------- TABLE ---------- */
  table.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .data-table th {
    text-align: left;
    color: var(--text-muted);
    font-weight: 600;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }
  .data-table td {
    padding: 10px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  .data-table tr:hover td { background: #fafcff; }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge-pending    { background: rgba(245,158,11,0.14); color: #b45309; }
  .badge-disposisi  { background: rgba(20,184,166,0.14); color: #0d9488; }
  .badge-selesai    { background: rgba(34,197,94,0.14); color: #15803d; }
  .badge-default    { background: rgba(107,124,147,0.14); color: #4b5b6f; }

  .empty-state {
    text-align: center;
    padding: 30px 10px;
    color: var(--text-muted);
    font-size: 13px;
  }

  /* ---------- placeholder page for other menus ---------- */
  .placeholder-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 60px 30px;
    text-align: center;
    border: 1px dashed var(--border);
    color: var(--text-muted);
  }
  .placeholder-card .big-ico { font-size: 40px; margin-bottom: 10px; }

  /* ---------- BUTTONS ---------- */
  .btn-primary {
    background: linear-gradient(135deg, var(--teal-500), #0d9488);
    color: #fff; border: none; padding: 10px 18px;
    border-radius: 9px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: opacity 0.15s;
  }
  .btn-primary:hover { opacity: 0.92; }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

  .btn-secondary {
    background: var(--bg); color: var(--text-main);
    border: 1px solid var(--border); padding: 10px 18px;
    border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn-secondary:hover { background: #eef2f7; }

  .btn-outline {
    background: #fff; color: #0d9488;
    border: 1.5px solid #14b8a6; padding: 9px 17px;
    border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn-outline:hover { background: rgba(20,184,166,0.08); }
  .btn-outline:disabled { opacity: 0.6; cursor: not-allowed; }

  .btn-icon {
    background: none; border: 1px solid var(--border); border-radius: 6px;
    width: 30px; height: 30px; cursor: pointer; font-size: 13px;
  }
  .btn-icon:hover { background: var(--bg); }

  .field-hint {
    font-size: 11.5px; color: var(--text-muted); margin-top: 6px; line-height: 1.5;
  }

  /* ---------- CHECKBOX GROUP (multi-pilih tujuan disposisi) ---------- */
  .checkbox-group-admin {
    max-height: 170px; overflow-y: auto;
    border: 1px solid #d7dfe9; border-radius: 8px;
    padding: 6px 12px; background: #fbfcfe;
  }
  .checkbox-item-admin {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; padding: 6px 0;
    border-bottom: 1px solid #f0f3f7;
  }
  .checkbox-item-admin:last-child { border-bottom: none; }
  .checkbox-item-admin input[type=checkbox] { width: auto; accent-color: var(--teal-500); }

  /* ---------- SPINNER (modal cetak PDF) ---------- */
  .pdf-spinner {
    width: 40px; height: 40px; margin: 0 auto;
    border: 4px solid #e6ebf2;
    border-top-color: var(--teal-500);
    border-radius: 50%;
    animation: pdf-spin 0.8s linear infinite;
  }
  @keyframes pdf-spin { to { transform: rotate(360deg); } }

  /* ---------- TABS (Data Master) ---------- */
  .tab-btn {
    background: none; border: none;
    border-bottom: 3px solid transparent;
    padding: 10px 4px; margin-right: 22px;
    font-size: 13.5px; font-weight: 600;
    color: var(--text-muted); cursor: pointer;
  }
  .tab-btn:hover { color: var(--text-main); }
  .tab-btn.active { color: var(--navy-900); border-bottom-color: var(--teal-500); }

  /* ---------- MODAL ---------- */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(10, 37, 64, 0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-box {
    background: #fff; border-radius: 16px;
    width: 100%; max-width: 640px;
    max-height: 88vh;
    display: flex; flex-direction: column;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
  }
  .modal-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 22px; border-bottom: 1px solid var(--border);
  }
  .modal-head h3 { margin: 0; font-size: 16px; }
  .modal-close {
    background: none; border: none; font-size: 16px;
    cursor: pointer; color: var(--text-muted);
    width: 28px; height: 28px; border-radius: 50%;
  }
  .modal-close:hover { background: var(--bg); }
  .modal-body { padding: 20px 22px; overflow-y: auto; }
  .modal-foot {
    display: flex; justify-content: flex-end; gap: 10px;
    padding: 16px 22px; border-top: 1px solid var(--border);
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 16px;
  }
  .form-group.span-2 { grid-column: 1 / -1; }
  .form-group label {
    display: block; font-size: 12px; font-weight: 600;
    color: #33475b; margin-bottom: 5px;
  }
  .form-group input, .form-group select {
    width: 100%; padding: 9px 11px;
    border: 1px solid #d7dfe9; border-radius: 8px;
    font-size: 13px; font-family: inherit;
    background: #fbfcfe;
  }
  .form-group input:disabled { color: var(--text-muted); background: #eef2f7; }
  .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--teal-500); }

  /* ---------- NOMOR SURAT PREVIEW (Surat Keluar) ---------- */
  .nomor-preview {
    background: linear-gradient(135deg, rgba(20,80,122,0.06), rgba(20,184,166,0.08));
    border: 1px dashed #9fc3d6;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 18px;
    text-align: center;
  }
  .nomor-preview-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--text-muted); margin-bottom: 4px;
  }
  .nomor-preview-value {
    font-family: Consolas, monospace;
    font-size: 15px; font-weight: 700;
    color: var(--navy-900);
    letter-spacing: 0.02em;
  }

  /* ============================================================
     RESPONSIVE — HP (≤640px), tablet (≤900px), tablet landscape (≤1100px)
     ============================================================ */
  img, canvas, iframe { max-width: 100%; }
  .panel { overflow-x: auto; }
  .panel-grid > * { min-width: 0; }
  .tabs-row { display: flex; gap: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tab-btn { white-space: nowrap; }

  /* tombol hamburger & backdrop: tersembunyi di desktop */
  .menu-toggle {
    display: none;
    width: 42px; height: 42px; flex-shrink: 0;
    align-items: center; justify-content: center;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; font-size: 20px; line-height: 1;
    color: var(--navy-900); cursor: pointer;
  }
  .menu-toggle:active { background: #e8eef5; }
  .sidebar-close {
    display: none; margin-left: auto;
    background: rgba(255,255,255,0.1); border: none; color: #fff;
    width: 32px; height: 32px; border-radius: 8px; font-size: 14px; cursor: pointer;
  }
  .sidebar-backdrop { display: none; }
  .topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }

  /* sel tabel yang dibungkus otomatis oleh JS (untuk mode kartu di HP) */
  .cell-val { min-width: 0; }

  @media (max-width: 1100px) {
    .sidebar { width: 220px; }
    .content { padding: 22px 22px 36px; }
    .topbar { padding: 16px 22px; }
  }

  /* ---------- TABLET & HP: sidebar jadi laci (drawer) ---------- */
  @media (max-width: 900px) {
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: 280px; max-width: 86vw;
      z-index: 200; overflow-y: auto;
      transform: translateX(-102%);
      transition: transform 0.25s ease;
      box-shadow: none;
      padding-top: calc(22px + env(safe-area-inset-top, 0px));
    }
    body.sidebar-open { overflow: hidden; }
    body.sidebar-open .sidebar { transform: none; box-shadow: 8px 0 30px rgba(0,0,0,0.3); }
    .sidebar-backdrop {
      display: block; position: fixed; inset: 0; z-index: 150;
      background: rgba(10, 37, 64, 0.5);
      opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    body.sidebar-open .sidebar-backdrop { opacity: 1; pointer-events: auto; }
    .menu-toggle, .sidebar-close { display: inline-flex; }
    .nav-item { padding: 13px 14px; font-size: 14.5px; }

    .topbar { position: sticky; top: 0; z-index: 50; padding: 12px 18px; gap: 12px; }
    .topbar h1 { font-size: 18px; }
    .search-box { width: 180px; }
    .content { padding: 18px 18px 34px; }

    /* target sentuh lebih besar */
    .btn-icon { width: 38px; height: 38px; font-size: 15px; }
    .btn-primary, .btn-secondary, .btn-outline { min-height: 40px; }
    .tab-btn { padding: 12px 4px; }
    .form-group input, .form-group select, textarea { min-height: 40px; }
    .modal-box { max-height: 92vh; }
  }

  /* ---------- HP ---------- */
  @media (max-width: 640px) {
    .topbar { flex-wrap: wrap; padding: 10px 14px; }
    .topbar h1 { font-size: 17px; }
    .topbar .muted { font-size: 12px; margin-top: 2px; }
    .topbar-right { width: 100%; order: 3; gap: 10px; }
    .search-box { flex: 1; width: auto; min-width: 0; }
    .content { padding: 14px 12px 30px; }

    /* cegah iOS auto-zoom saat fokus ke input */
    input, select, textarea, .search-box { font-size: 16px !important; }

    .stat-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 18px; }
    .stat-card { padding: 12px; gap: 10px; flex-direction: column; align-items: flex-start; }
    .stat-icon { width: 38px; height: 38px; font-size: 17px; }
    .stat-value { font-size: 20px; }
    .stat-label { font-size: 11.5px; }

    .panel { padding: 14px; border-radius: 12px; }
    .panel-grid { gap: 12px; }
    .btn-primary, .btn-secondary, .btn-outline { padding-left: 14px; padding-right: 14px; }

    /* form 1 kolom */
    .form-grid { grid-template-columns: 1fr; gap: 12px; }
    .form-group.span-2 { grid-column: auto; }

    /* modal menjadi bottom-sheet penuh lebar */
    .modal-overlay { padding: 0; align-items: flex-end; }
    .modal-box {
      max-width: 100% !important; width: 100%;
      max-height: 94vh;
      border-radius: 16px 16px 0 0;
    }
    .modal-head { padding: 14px 16px; }
    .modal-head h3 { font-size: 15px; padding-right: 8px; }
    .modal-body { padding: 14px 16px; }
    .modal-foot {
      flex-wrap: wrap; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    }
    .modal-foot > * { flex: 1 1 calc(50% - 10px); }
    .modal-foot > .btn-primary { flex-basis: 100%; order: -1; }
    .modal-close { width: 36px; height: 36px; font-size: 18px; }

    /* ---------- TABEL → KARTU ---------- */
    table.data-table.rt { border-collapse: separate; border-spacing: 0; }
    table.data-table.rt thead { display: none; }
    table.data-table.rt, table.data-table.rt tbody,
    table.data-table.rt tr, table.data-table.rt td { display: block; width: 100%; }
    table.data-table.rt tr {
      border: 1px solid var(--border); border-radius: 12px;
      padding: 4px 12px; margin-bottom: 10px; background: #fff;
      box-shadow: 0 2px 8px rgba(15, 61, 92, 0.05);
    }
    table.data-table.rt tr:hover td { background: transparent; }
    table.data-table.rt td {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 14px;
      padding: 9px 0; border-bottom: 1px dashed var(--border);
      text-align: right; font-size: 13px;
    }
    table.data-table.rt td:last-child { border-bottom: none; }
    table.data-table.rt td::before {
      content: attr(data-label);
      flex: 0 0 38%; max-width: 38%; text-align: left;
      font-size: 11px; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.03em; padding-top: 2px;
    }
    table.data-table.rt td[data-label=""]::before { display: none; }
    table.data-table.rt td .cell-val { flex: 1; text-align: right; word-break: break-word; }
    table.data-table.rt td .cell-val > div { justify-content: flex-end; }
    /* pembungkus scroll tidak perlu pada mode kartu */
    div[style*="overflow-x:auto"] { overflow-x: visible !important; }

    .nomor-preview-value { font-size: 13px; word-break: break-all; }
    .checkbox-group-admin { max-height: 220px; }
    .checkbox-item-admin { padding: 10px 0; }
    .checkbox-item-admin input[type=checkbox] { width: 20px; height: 20px; }
  }

  /* ---------- HP kecil ---------- */
  @media (max-width: 380px) {
    .stat-grid { grid-template-columns: 1fr 1fr; }
    .stat-value { font-size: 18px; }
    .topbar .muted { display: none; }
  }
</style>
